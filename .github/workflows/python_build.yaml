# Trunk-based: runs on PRs and pushes to main. Lints + tests every change, then
# (only on a push to main, or a manual run) builds the MCP-server container and
# deploys it to Cloud Run. See DEPLOY.md for the one-time GCP/WIF/OAuth setup.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# id-token: needed for keyless auth to GCP via Workload Identity Federation.
permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: vino9-276317
  GCP_REGION: us-west1 # "oregon"
  SERVICE_NAME: track-me
  AR_REPO: track-me # Artifact Registry repo (Docker format) in GCP_REGION
  GCS_BUCKET: vinolab # mounted at runtime; TRACKME_USERDATA points inside it

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.19"
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check .

      - name: Unit tests
        run: uv run pytest -q

  deploy:
    needs: pytest
    # Only ship from main (or a manual dispatch); PRs stop after pytest.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Image metadata
        id: meta
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${AR_REPO}/${SERVICE_NAME}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${IMAGE}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The server must know its own public URL (OAuth metadata + the Google
      # redirect URI MCP_BASE_URL/auth/callback). Use the repo variable
      # MCP_BASE_URL if set (e.g. a custom domain), else the service's existing
      # run.app URL — stable across deploys of the same service name.
      - name: Resolve public URL
        id: url
        env:
          MCP_BASE_URL_OVERRIDE: ${{ vars.MCP_BASE_URL }}
        run: |
          URL="${MCP_BASE_URL_OVERRIDE}"
          if [ -z "$URL" ]; then
            URL=$(gcloud run services describe "${SERVICE_NAME}" \
              --project="${GCP_PROJECT}" --region="${GCP_REGION}" \
              --format='value(status.url)' 2>/dev/null || true)
          fi
          if [ -z "$URL" ]; then
            echo "::error::No MCP_BASE_URL repo variable and no existing service URL" \
              "— set vars.MCP_BASE_URL (see DEPLOY.md)."
            exit 1
          fi
          URL="${URL%/}"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "::notice::MCP endpoint ${URL}/mcp — Google OAuth redirect URI ${URL}/auth/callback"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --project="${GCP_PROJECT}" \
            --region="${GCP_REGION}" \
            --image="${{ steps.meta.outputs.tag }}" \
            --platform=managed \
            --execution-environment=gen2 \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --max-instances=1 \
            --timeout=60s \
            --allow-unauthenticated \
            --service-account="${SERVICE_NAME}@${GCP_PROJECT}.iam.gserviceaccount.com" \
            --add-volume="name=userdata,type=cloud-storage,bucket=${GCS_BUCKET}" \
            --add-volume-mount="volume=userdata,mount-path=/mnt/gcs" \
            --set-env-vars="TRACKME_USERDATA=/mnt/gcs/track_me,DB_IMMUTABLE=1,FASTMCP_HOME=/mnt/gcs/track_me/mcp_oauth,MCP_BASE_URL=${{ steps.url.outputs.url }}" \
            --set-secrets="GOOGLE_OAUTH_CLIENT_ID=track-me-oauth-client-id:latest,GOOGLE_OAUTH_CLIENT_SECRET=track-me-oauth-client-secret:latest,MCP_ALLOWED_EMAILS=track-me-mcp-allowed-emails:latest"
            # --allow-unauthenticated: Cloud Run lets requests through; the app
            # itself enforces Google OAuth + the MCP_ALLOWED_EMAILS allowlist on
            # every /mcp request (401 otherwise). Chat clients can't mint Cloud
            # Run IAM tokens, so IAM auth isn't an option here.
            #
            # DB_IMMUTABLE=1: the server opens the SQLite catalog read-only +
            # immutable, so SQLite skips locking/WAL over the gcsfuse mount. Safe
            # because ingest/geocode never run in this container — the DB is only
            # rewritten out-of-band (upload a fresh object; instances restart to
            # pick it up). Drop this env var if the mounted DB is ever written live.
            #
            # FASTMCP_HOME: OAuth state (client registrations + encrypted tokens,
            # one small file per key) on the bucket, so a restart or scale-to-zero
            # doesn't sign ChatGPT out. max-instances=1 keeps token refresh
            # single-writer.
            #
            # --set-env-vars / --set-secrets REPLACE the old viewer's settings
            # (Cloudflare Access vars, Maps key), which this service no longer uses.
